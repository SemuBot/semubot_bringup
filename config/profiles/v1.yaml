# SemuBot V1: wheelbase driven from the Raspberry Pi 5 GPIO by semubot_raspberry_bringup. /cmd_vel is unitless, -1..1.
# Every component reads its own section; ROS nodes load the file as a parameter file.

cmd_vel_motor_driver:
  ros__parameters:
    cmd_vel_timeout: 0.5

battery_monitor:
  ros__parameters:
    i2c_bus: 1
    i2c_address: 64
    rate_hz: 2.0
    voltage_scale: 1.0
    cells: 7

joy_node:
  ros__parameters:
    device_id: 0
    deadzone: 0.05
    autorepeat_rate: 20.0

teleop_twist_joy:
  ros__parameters:
    axis_linear: {x: 1, y: 0}
    axis_angular: {yaw: 2}
    scale_linear: {x: 1.0, y: 1.0}
    scale_angular: {yaw: 1.0}
    enable_button: 7

semubot_webapp:
  ros__parameters:
    max_linear_velocity: 1.0
    max_angular_velocity: 1.0

semubot_chest_display:
  ros__parameters:
    speed_scale_min: 0.1
    speed_scale_max: 1.0
    speed_scale_step: 0.1
    speed_scale_default: 1.0

# Voice and language model of the robot; keys and service addresses stay in ~/.config/semubot/brain.env.
semu_brain_node:
  ros__parameters:
    tts_speaker: mari
    cloud_provider: claude
    claude_model: claude-opus-5-5
